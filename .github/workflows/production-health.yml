name: Verify Noor Al Amal production health

on:
  push:
    paths:
      - ".github/workflows/production-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed FastAPI database connectivity
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sSL --max-time 25 -o /tmp/noor-health.json -w '%{http_code}' 'https://noor-alamal-python-reports.vercel.app/health')
          echo "HTTP status: ${code}"
          HTTP_STATUS="${code}" python3 - <<'PY'
          import json
          import os
          import sys
          try:
              with open('/tmp/noor-health.json', encoding='utf-8') as f:
                  data = json.load(f)
          except (OSError, ValueError):
              print('Health endpoint did not return valid JSON (may be protected by Vercel Authentication).')
              sys.exit(1)
          status = data.get('status') if isinstance(data, dict) else None
          print('Application health status:', status)
          if os.environ.get('HTTP_STATUS') != '200' or status != 'ready':
              sys.exit(1)
          PY
