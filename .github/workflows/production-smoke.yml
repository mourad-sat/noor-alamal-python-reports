name: Production smoke — Noor Al Amal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "app.py"
      - "platform_v2*.py"
      - "templates/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health, database and login page
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://noor-alamal-python-reports.vercel.app"
          echo "Checking production health..."
          http_code=$(curl --silent --show-error --location --retry 2 --retry-delay 3 --max-time 45 -w '%{http_code}' "$BASE/health" -o /tmp/health.json)
          echo "Health HTTP status: $http_code"
          cat /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result.get('service') == 'noor-alamal', 'Unexpected service in /health'
          assert result.get('status') == 'ready', f"Health is not ready: {result.get('status')}"
          print('Production app /health=ready and database reachable')
          PY
          echo "Checking login page..."
          curl --fail-with-body --silent --show-error --location --retry 2 --retry-delay 3 --max-time 45 "$BASE/login" -o /tmp/login.html
          grep -q -i 'password\|كلمة المرور\|تسجيل الدخول' /tmp/login.html
          echo "Production login page available"
          echo "Checking the new main entry..."
          root_code=$(curl --silent --show-error --max-time 45 --output /dev/null --dump-header /tmp/root-headers -w '%{http_code}' "$BASE/")
          test "$root_code" = "303" || { echo "Root should redirect to login for unauthenticated visitors (got $root_code)"; exit 1; }
          grep -qi '^location: /login' /tmp/root-headers
          echo "Root login protection and new entry verified"
