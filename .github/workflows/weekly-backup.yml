name: Noor Al Amal weekly encrypted backup

on:
  schedule:
    - cron: "17 3 * * 0" # Sunday, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: noor-weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.NOOR_BACKUP_DATABASE_URL }}
      BACKUP_FERNET_KEY: ${{ secrets.NOOR_BACKUP_FERNET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify backup credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL}" || { echo "NOOR_BACKUP_DATABASE_URL is not configured"; exit 1; }
          test -n "${BACKUP_FERNET_KEY}" || { echo "NOOR_BACKUP_FERNET_KEY is not configured"; exit 1; }
      - name: Install encryption library
        run: python -m pip install 'cryptography==46.0.3'
      - name: Dump Postgres database with attachments
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private-backup
          docker run --rm -e DATABASE_URL postgres:17-alpine sh -c \
            'exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl' \
            > private-backup/noor.dump
          test -s private-backup/noor.dump
      - name: Encrypt and check integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backup_crypto.py encrypt private-backup/noor.dump private-backup/noor.dump.enc
          python scripts/backup_crypto.py verify private-backup/noor.dump.enc
          rm -f private-backup/noor.dump
      - name: Upload encrypted backup (private artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noor-weekly-${{ github.run_id }}
          path: private-backup/noor.dump.enc
          if-no-files-found: error
          retention-days: 35
          compression-level: 0
      - name: Keep the latest four weekly archives
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("noor-weekly-")) | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +5 | cut -f2 > /tmp/older-noor-artifacts.txt
          while read -r artifact_id; do
            test -n "$artifact_id" || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < /tmp/older-noor-artifacts.txt
